<!doctype html>
<html lang="pt-BR" data-phosphor="green">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joaquim · Desenvolvedor de software</title>
    <meta name="description" content="Portfólio de Joaquim, desenvolvedor de software. Ligue a tela: projetos atualizados direto do GitHub." />
    <meta name="theme-color" content="#0a0c0a" />
    <meta name="color-scheme" content="dark" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Joaquim · Desenvolvedor de software" />
    <meta property="og:description" content="Ligue a tela: um monitor CRT, um mergulho e os meus projetos lá dentro." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/AtkinsonHyperlegibleNext-Variable.woff2" as="font" type="font/woff2" crossorigin />

    <script>
      // Antes do primeiro paint: tema salvo e capa escura da intro (sem piscar o portfólio).
      (function () {
        var d = document.documentElement;
        try {
          if (localStorage.getItem("lt:phosphor") === "amber") d.dataset.phosphor = "amber";
        } catch (e) {}
        var hash = location.hash.length > 1;
        var skip = /[?&]sem-intro/.test(location.search);
        if (!hash && !skip) d.dataset.intro = "on";
      })();
    </script>
    <style>
      html { background: #0a0c0a; }
      #intro-cover { display: none; }
      html[data-intro="on"] #intro-cover { display: block; position: fixed; inset: 0; z-index: 50; background: #050605; }
    </style>
  </head>
  <body>
    <div id="intro-cover" aria-hidden="true"></div>
    <div id="root"></div>
    <noscript>
      <p style="font-family: monospace; color: #5cff8f; padding: 24px">Este portfólio precisa de JavaScript para ligar a tela.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
